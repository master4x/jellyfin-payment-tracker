name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (z. B. 1.0.1)"
        required: true
      changelog:
        description: "Changelog"
        default: "Fehlerbehebungen und Verbesserungen."

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      PROJECT: Jellyfin.Plugin.PaymentTracker
      VERSION: ${{ inputs.version }}
      CHANGELOG: ${{ inputs.changelog }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Build und Release
        run: |
          # Jellyfin erwartet vierstellige Versionen.
          VERSION="${VERSION#v}"; [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] && VERSION="$VERSION.0"
          ZIP="payment-tracker_$VERSION.zip"

          dotnet publish "$PROJECT" -c Release -o publish -p:Version="$VERSION"
          zip -j "$ZIP" "publish/$PROJECT.dll"
          gh release create "v$VERSION" "$ZIP" --title "v$VERSION" --notes "$CHANGELOG"

          # targetAbi = verwendete Jellyfin.Controller-Version (Mindest-Serverversion).
          ABI=$(sed -n 's/.*Include="Jellyfin.Controller" Version="\([0-9.]*\)".*/\1.0/p' "$PROJECT/$PROJECT.csproj")

          jq --arg v "$VERSION" --arg c "$CHANGELOG" --arg abi "$ABI" \
             --arg url "https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION/$ZIP" \
             --arg md5 "$(md5sum "$ZIP" | cut -d' ' -f1)" --arg ts "$(date -u +%FT%TZ)" \
             '.[0].versions = [{version: $v, changelog: $c, targetAbi: $abi, sourceUrl: $url, checksum: $md5, timestamp: $ts}] + .[0].versions' \
             manifest.json > manifest.tmp && mv manifest.tmp manifest.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update manifest for v$VERSION" && git push
